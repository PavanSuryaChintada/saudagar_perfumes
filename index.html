<head>
  <meta charset="UTF-8" />

  <title>SAUDAGAR PERFUMERS | Haute Parfumerie</title>
  <meta name="description" content="Saudagar Perfumers is an artisanal luxury niche fragrance house offering custom bespoke perfumes, personalized fragrances &amp; rare oriental extracts in sculptural crystal flacons." />
  <link rel="icon" type="image/png" href="/images/saudagar_logo_gold.png" />

  <!-- Theme Pre-Mount Synchronizer (Defaults to Pure White Editorial Luxury) -->
  <script>
    (function() {
      try {
        var t = localStorage.getItem('saudagar_theme_mode');
        if (t === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body class="bg-white dark:bg-[#0B0A0D] text-[#111111] dark:text-white antialiased selection:bg-[#C4823F] dark:selection:bg-[#D4AF37] dark:selection:text-[#0B0A0D] selection:text-white min-h-screen transition-colors duration-300">

</body>
